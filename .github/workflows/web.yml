# Stavba webu na GitHubu. Zdroj je tools/web-github.yml v repu videí,
# web_publikuj.sh ho kopíruje do .github/workflows/web.yml v repu GitHub Pages.
#
# Repo Pages obsahuje podklady (zdroj/: web.py, texty videí, časy zveřejnění)
# a zmenšené obrázky (obrazky/), ne hotový web. Stavba běží
#   - po každém pushi z web_publikuj.sh,
#   - kolem 21:00 Prahy po deseti minutách, jinak po hodině — ale stavba jen,
#     když od minula vyšlo naplánované video
#     (porovná `web.py --vydana` s /stav.json živého webu),
#   - ručně (Actions -> Web -> Run workflow).
# Takže naplánované video přibude na web do hodiny po zveřejnění, i když
# počítač s repem videí neběží. Postup: docs/web.md.
name: Web
on:
  push:
    branches: [main]
  # GitHub plánované běhy při zátěži zpožďuje i ZAHAZUJE: 2026-11-19 po hodinovém
  # "7 * * * *" proběhly jen 01:15, 10:14 a 19:27 UTC, takže 157 (vyšlo 20:00 UTC)
  # na webu do půlnoci nebylo. Proto hustě kolem vydání (21:00 Praha = 20:00 UTC
  # v zimě, 19:00 v létě) a k tomu pojistka po hodině. Běh bez změny trvá ~20 s.
  schedule:
    - cron: "4,14,24,34,44,54 19-21 * * *"
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vyšlo od minula nějaké video?
        id: kontrola
        run: |
          ma_byt=$(python zdroj/tools/web.py --vydana)
          venku=$(curl -sf https://theresmoretoit-channel.github.io/stav.json \
            | python -c 'import json,sys; print(json.dumps(sorted(json.load(sys.stdin)["vydana"])))' || echo nic)
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$ma_byt" != "$venku" ]; then
            echo "stavet=1" >> "$GITHUB_OUTPUT"
          else
            echo "beze změny, nestavím"
          fi
      - name: Stavba
        if: steps.kontrola.outputs.stavet
        run: |
          pip install --quiet pillow
          python zdroj/tools/web.py --out _site --predchozi obrazky
      - if: steps.kontrola.outputs.stavet
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages hned po nahrání artefakt nevidí: od 2026-11-23 22:53 UTC
      # padal každý běh na "No artifacts named github-pages were found",
      # přestože artefakt (103 MB) v běhu ležel — nasazení startovalo ve stejné
      # sekundě, kdy nahrávání skončilo, a vzdalo to do sekundy. Počkat, až ho
      # API běhu ukáže, a k tomu rezerva.
      - name: Počkat, až je artefakt vidět
        if: steps.kontrola.outputs.stavet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            if curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                | grep -q '"name": *"github-pages"'; then
              echo "artefakt vidět po $((i*5)) s"; sleep 15; exit 0
            fi
            sleep 5
          done
          echo "artefakt není vidět ani po 120 s, zkouším nasadit stejně"
      - id: nasazeni
        if: steps.kontrola.outputs.stavet
        uses: actions/deploy-pages@v4
